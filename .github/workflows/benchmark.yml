# 경기도 인접 시와의 대조 통계(benchmark.json)를 만드는 워크플로
# 매일 도는 수집 작업과 분리해 둔다. 여기가 실패해도 뉴스 수집은 영향을 받지 않는다.
name: 대조 통계 수집

on:
  # 매일 한국시간 오전 6시. 화성시 기사 수집과 같은 시각이다.
  # 우리는 발표에서 "매일 아침 6시에 자동으로 갱신된다"고 말했다.
  # 화면이 발표와 다른 말을 하면 안 되므로 대조도 같은 주기로 돈다.
  # 표본이 작아 하루 사이 값이 흔들리는 문제는 주기를 늦춰서가 아니라
  # 신뢰구간을 함께 보여주는 것으로 다룬다. 흔들리는 폭을 감추지 않고 그린다.
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "며칠치를 비교할지 (기본 14)"
        default: "14"
      cap:
        description: "도시당 최대 처리 건수 (기본 400)"
        default: "400"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 경기 5대 시 수집 및 판정
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BENCH_DAYS: ${{ inputs.days || '14' }}
          BENCH_CAP: ${{ inputs.cap || '400' }}
        run: python benchmark.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain benchmark.json benchmark_history.json)" ]; then
            git add benchmark.json benchmark_history.json
            git commit -m "대조 통계 수집 $(date -u -d '+9 hours' +'%Y-%m-%d')"
            # 다른 워크플로가 먼저 밀어넣었을 수 있다. 최신을 당겨온 뒤 다시 시도한다.
            # --autostash 가 없으면 파이썬이 만든 캐시 파일 때문에
            # "cannot pull with rebase: You have unstaged changes" 로 죽는다. 실제로 겪었다.
            git pull --rebase --autostash origin main
            git push
          else
            echo "변경사항이 없어 커밋하지 않습니다."
          fi
