# 경기도 인접 시와의 대조 통계(benchmark.json)를 만드는 워크플로
# 매일 도는 수집 작업과 분리해 둔다. 여기가 실패해도 뉴스 수집은 영향을 받지 않는다.
name: 대조 통계 수집

on:
  # 월요일 한국시간 오전 6시. 주간 보고서 주기와 맞춘다.
  # 매일 돌리지 않는 이유 — 도시당 표본이 80~85건뿐이라 하루 사이의 오르내림이
  # 실제 변화가 아니라 표본 오차다(화성시 4/85의 95% 구간이 1.8~11.5%, 한 건이 1.2%p를 움직인다).
  # 그 흔들림을 추세로 읽으면 잘못 대응하게 된다. 창도 14일이라 하루에 7%만 바뀐다.
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "며칠치를 비교할지 (기본 14)"
        default: "14"
      cap:
        description: "도시당 최대 처리 건수 (기본 400)"
        default: "400"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 경기 5대 시 수집 및 판정
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BENCH_DAYS: ${{ inputs.days || '14' }}
          BENCH_CAP: ${{ inputs.cap || '400' }}
        run: python benchmark.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain benchmark.json benchmark_history.json)" ]; then
            git add benchmark.json benchmark_history.json
            git commit -m "대조 통계 수집 $(date -u -d '+9 hours' +'%Y-%m-%d')"
            # 다른 워크플로가 먼저 밀어넣었을 수 있다. 최신을 당겨온 뒤 다시 시도한다.
            git pull --rebase origin main
            git push
          else
            echo "변경사항이 없어 커밋하지 않습니다."
          fi
