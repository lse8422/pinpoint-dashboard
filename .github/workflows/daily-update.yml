# 매일 아침 화성시 뉴스를 자동 수집해 news_live.json을 갱신하고 커밋하는 워크플로
name: 뉴스 자동 수집

on:
  schedule:
    # 정각(:00)은 깃허브 예약 대기열이 가장 붐비는 시각이다.
    # 실제로 8/14~8/25 실행이 매번 40~57분 밀렸고,
    # 8/26분은 아예 뜨지 않아 8/27 아침 수집이 통째로 빠졌다.
    # 그래서 정각을 피하고, 예비 예약을 두 시간 뒤에 하나 더 둔다.
    # 이미 담은 기사는 제목으로 걸러내므로 두 번 돌아도 결과가 같고,
    # 새 기사가 없으면 AI를 부르지 않아 비용도 늘지 않는다.
    - cron: "7 21 * * *"     # UTC 21:07 = 한국시간 오전 6시 7분 (본 실행)
    - cron: "7 23 * * *"     # UTC 23:07 = 한국시간 오전 8시 7분 (본 실행이 버려졌을 때의 예비)
  workflow_dispatch:         # Actions 탭에서 수동 실행도 가능
    inputs:
      days:
        description: "며칠치를 수집할지 (평소 2, 빈 기간 메울 때만 늘린다)"
        default: "2"
      max_new:
        description: "한 번에 처리할 최대 건수 (평소 100)"
        default: "100"

permissions:
  contents: write            # 갱신한 JSON을 저장소에 커밋하기 위해 필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 뉴스 수집 및 분류
        env:
          # 키가 없으면 스크립트가 키워드 규칙으로 자동 전환한다
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COLLECT_DAYS: ${{ inputs.days }}
          COLLECT_MAX: ${{ inputs.max_new }}
          # 며칠째 무중단으로 돌았는지 세기 위해 실행 이력을 조회한다
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python collect.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain news_live.json)" ]; then
            git add news_live.json
            git commit -m "뉴스 자동 수집 $(date -u -d '+9 hours' +'%Y-%m-%d')"
            # 다른 워크플로가 먼저 밀어넣었을 수 있다. 최신을 당겨온 뒤 다시 시도한다.
            git pull --rebase origin main
            git push
          else
            echo "변경사항이 없어 커밋하지 않습니다."
          fi
