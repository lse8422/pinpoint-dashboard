<!DOCTYPE html>
<!-- 담당자가 출근길에 휴대폰으로 오늘 볼 것만 확인하는 간편 화면 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%8D%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>핀포인트 간편 보기 — 오늘 확인할 것</title>
<meta name="theme-color" content="#17335c">
<link rel="stylesheet" href="pretendard.min.css">
<style>
  :root {
    --bg: #F4F5F6; --surface: #fff; --border: #e3e8f0; --green: #17335c;
    --green-dark: #12294A; --green-light: #E7ECF3; --title: #17335c;
    --text: #1A2332; --muted: #7a8599; --muted2: #9aa4b5; --neg: #C26060;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: Pretendard, 'Malgun Gothic', -apple-system, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    padding: 0 0 34px; -webkit-text-size-adjust: 100%; }

  /* 제호 — 전체 화면과 같은 성격으로. 신문 제호처럼 좁게 짜고 굵은 선으로 닫는다. */
  .top { background: var(--surface); color: var(--title);
    padding: calc(15px + env(safe-area-inset-top)) 16px 12px;
    border-bottom: 2.5px solid var(--title); }
  .top .t { font-size: 20px; font-weight: 800; letter-spacing: -.045em; line-height: 1.15; }
  .top .s { font-size: 11.5px; color: var(--muted); margin-top: 4px;
    font-variant-numeric: tabular-nums; }

  .wrap { padding: 14px 14px 0; max-width: 620px; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--border);
    border-radius: 2px; padding: 15px 16px; margin-bottom: 11px; }

  .surge { background: #FDF3F3; border: 1px solid #EBC9C9; border-left: 4px solid var(--neg);
    border-radius: 2px; padding: 12px 14px; margin-bottom: 11px; font-size: 14px; line-height: 1.6; }
  .surge b { color: #A03D3D; }

  h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 2px 9px;
    display: flex; align-items: baseline; gap: 7px; }
  h2 .n { color: var(--green-dark); font-weight: 800; font-size: 14px; }

  /* 이슈는 상자를 겹치지 않고 괘선으로 나눈다. 좁은 화면일수록 상자가 자리를 먹는다. */
  .items { background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--neg); margin-bottom: 11px; }
  .item { display: block; text-decoration: none; color: inherit;
    background: none; border: none; border-bottom: 1px solid var(--border);
    border-radius: 0; padding: 13px 15px; margin: 0; }
  .item:last-child { border-bottom: none; }
  .item:active { background: #FAFBFC; }
  /* 소관 후보 부서 — 전체 화면과 같은 정보를 담는다. 여기서 끊기면 반쪽이다. */
  .item .dept { margin-top: 7px; font-size: 11.5px; color: var(--muted);
    background: #F5F6F8; border: 1px solid var(--border); padding: 5px 9px; }
  .item .dept b { color: var(--title); }
  .item .rank { display: inline-flex; align-items: center; justify-content: center;
    width: 21px; height: 21px; border-radius: 50%; background: var(--neg); color: #fff;
    font-size: 11.5px; font-weight: 800; margin-right: 7px; vertical-align: 2px; }
  .item .ti { font-size: 15.5px; font-weight: 700; color: var(--title); line-height: 1.45; }
  .item .meta { margin-top: 8px; font-size: 12px; color: var(--muted); display: flex;
    align-items: center; gap: 8px; flex-wrap: wrap; }
  .item .st { background: var(--green-light); color: var(--green-dark);
    font-weight: 700; padding: 2px 8px; border-radius: 2px; font-size: 11.5px; }
  .item .sc { margin-left: auto; color: var(--neg); font-weight: 800; font-size: 13px; }
  .item .go { font-size: 11.5px; color: var(--muted2); font-weight: 500; }

  .more { width: 100%; border: 1px solid var(--border); background: var(--surface);
    color: var(--green-dark); font-family: inherit; font-size: 14px; font-weight: 700;
    padding: 13px; border-radius: 2px; cursor: pointer; }
  .sub { font-size: 14px; padding: 11px 4px; border-bottom: 1px solid #eef1f5; display: block;
    text-decoration: none; color: var(--text); }
  .sub:last-child { border-bottom: none; }
  .sub .d { font-size: 11.5px; color: var(--muted2); margin-right: 6px; }

  .foot { text-align: center; font-size: 12px; color: var(--muted2); margin: 16px 0 10px; line-height: 1.7; }
  .foot b { color: var(--green-dark); }
  .full { display: block; text-align: center; background: var(--green); color: #fff;
    text-decoration: none; font-size: 14.5px; font-weight: 700; padding: 15px;
    border-radius: 2px; margin-top: 6px; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 26px 0; }

  /* ══ 공공 서비스 조판 ══════════════════════════════════════
     GOV.UK 디자인 시스템 · 화성특례시청 · e-나라지표를 열어 값을 재고 맞췄다.
     각지고, 그림자가 없고, 글자가 크고, 색이 중성 회색이다. */
  :root {
    --text: #1a1a1a; --muted: #505050; --muted2: #767676; --border: #cfcfcf;
  }
  body { font-size: 15px; }
  .card, .mini, .item, .items, .surge, .more, .full, .sub {
    border-radius: 0;
  }
  .item .ti { font-size: 16px; }
  .item .meta { font-size: 12.5px; }
  .item .dept { font-size: 12px; border-radius: 0; }
  .mini h3, h2 { font-size: 15px; }
  .sub { font-size: 14.5px; }
  .more, .full { border: 2px solid var(--green); font-size: 15px; }
  /* 공공 서비스는 키보드만으로도 쓸 수 있어야 한다. GOV.UK의 노란 포커스 표준을 따른다. */
  a:focus-visible, button:focus-visible {
    outline: 3px solid #ffdd00; outline-offset: 0;
    box-shadow: 0 3px 0 0 #0b0c0c; background-color: #ffdd00; color: #0b0c0c;
  }

  /* 숫자는 자릿수가 맞아야 훑을 때 읽힌다. */
  .item .sc, .item .meta, .spark, .bar, .foot, .sub .d, .top .s {
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  /* 상태 꼬리표만 알약. 나머지는 각지게. */
  .item .st { border-radius: 999px; }
  .more, .full { border-radius: 2px; }

  /* 차트 라이브러리를 쓰지 않는다. 간편 화면은 파일 하나만 받고 빨리 떠야 한다. */
  .mini { background: var(--surface); border: 1px solid var(--border);
    border-radius: 2px; padding: 14px 15px 12px; margin-bottom: 11px; }
  .mini h3 { font-size: 13.5px; color: var(--title); margin-bottom: 2px; }
  .mini .cap { font-size: 11.5px; color: var(--muted2); margin-bottom: 11px; }

  .spark { display: flex; align-items: flex-end; gap: 3px; height: 62px; }
  .spark .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
    height: 100%; position: relative; }
  .spark .bar { width: 100%; border-radius: 3px 3px 0 0; background: var(--neg); min-height: 2px; }
  .spark .bar.zero { background: var(--border); height: 2px; }
  .spark .n { font-size: 9.5px; color: var(--neg); font-weight: 700; text-align: center;
    margin-bottom: 2px; height: 12px; }
  .sparkx { display: flex; gap: 3px; margin-top: 5px; }
  .sparkx span { flex: 1; font-size: 9px; color: var(--muted2); text-align: center; }

  .hbar { margin-bottom: 9px; }
  .hbar:last-child { margin-bottom: 0; }
  .hbar .t { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; margin-bottom: 4px; }
  .hbar .t b { color: var(--neg); font-size: 13.5px; }
  .hbar .t .c { color: var(--muted2); font-size: 11px; margin-left: auto; }
  .hbar .track { height: 8px; background: var(--bg); border-radius: 2px; overflow: hidden; }
  .hbar .fill { height: 100%; background: var(--neg); border-radius: 2px; }
  /* 전부 부정 비율이다. 낮다고 다른 색으로 칠하면 좋은 소식처럼 읽힌다.
     색은 하나로 두고 길이로만 크기를 말한다. 낮은 것은 옅게. */
  .hbar.low .fill { opacity: .45; }
  /* 화성시 전용색(오렌지)은 글자에 쓰기엔 명암비가 3.01로 낮다.
     띠 한 줄로만 둔다. 읽는 색이 아니라 어디 자료인지 알리는 표시다. */
  body::before { content: ""; display: block; height: 4px; background: #E66B1E; }
</style>
</head>
<body>

<div class="top">
  <div class="t">핀포인트 · 오늘 확인할 것</div>
  <div class="s" id="asof">불러오는 중…</div>
</div>

<div class="wrap">
  <div id="surge"></div>
  <h2><span class="n">우선 확인</span> 부정 보도를 사건 단위로 묶어 순서를 매겼습니다</h2>
  <div id="list"><div class="empty">불러오는 중…</div></div>

  <div class="mini" id="sparkBox" style="display:none;">
    <h3>최근 2주 부정 보도</h3>
    <div class="cap">막대가 높은 날에 무슨 일이 있었는지 보시면 됩니다</div>
    <div class="spark" id="spark"></div>
    <div class="sparkx" id="sparkx"></div>
  </div>

  <div class="mini" id="catBox" style="display:none;">
    <h3>분야별 부정 비율</h3>
    <div class="cap" id="catCap"></div>
    <div id="catBars"></div>
  </div>

  <div id="recentBox" style="display:none;">
    <h2><span class="n">최근 부정 보도</span> 위 3건 외</h2>
    <button class="more" id="moreBtn">펼쳐 보기</button>
    <div class="card" id="recent" style="display:none; margin-top:9px;"></div>
  </div>

  <div class="foot" id="ops"></div>
  <a class="full" href="index.html">전체 화면으로 보기 →</a>
  <div class="foot" style="margin-top:12px">소관 후보 부서는 <b>기사를 보고 판정한 값이 아닙니다.</b> 분야에 해당하는 부서를 화성특례시 행정조직안내에서 가져와 후보로만 보여드립니다.</div>
  <div class="foot">화성시 홍보 담당 부서용 · 사무실에서는 전체 화면을 권합니다</div>
</div>

<script>
// 간편 화면은 자동수집분(news_live.json) 하나만 읽는다.
// 오늘 확인할 것은 최근 기사라 그 안에서 원문을 모두 찾을 수 있고,
// 파일을 하나만 받으므로 휴대폰에서 훨씬 빨리 뜬다.
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const CAT = { 문화관광: "문화·관광", 산업경제: "산업·경제" };

// 소관 후보 부서. 기사를 보고 판정한 값이 아니라 분야에 해당하는 부서다.
// 전체 화면(index.html)과 같은 표를 쓴다. 두 화면이 다른 말을 하면 안 된다.
// 출처 — 화성특례시 행정조직안내 (2026-08-27 확인)
const DEPT = {
  "교통": ["교통정책과", "대중교통과", "주차물류과", "철도전략과"],
  "환경": ["기후환경정책과", "물환경생태과", "자원순환과", "환경지도과"],
  "안전": ["안전정책과", "재난대응과", "건설과"],
  "복지": ["복지정책과", "통합돌봄과", "장애인복지과"],
  "문화관광": ["문화예술과", "관광진흥과", "문화유산과", "체육진흥과"],
  "산업경제": ["지역경제과", "기업지원과", "투자유치과", "농업정책과"],
  "행정": ["자치행정과", "예산재정과", "세정과"],
};

fetch("news_live.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(render)
  .catch(() => {
    document.getElementById("asof").textContent = "데이터를 불러오지 못했습니다";
    document.getElementById("list").innerHTML =
      '<div class="empty">잠시 후 다시 열어 주세요.<br>전체 화면은 아래 버튼으로 갈 수 있습니다.</div>';
  });

function render(d) {
  const today = d.today || {};
  const items = today.items || [];
  const byTitle = {};
  (d.items || []).forEach(a => { byTitle[a.title] = a; });

  document.getElementById("asof").textContent =
    (today.updated || d.updated || "") + " 기준 · 자동 수집";

  // 분야 급증
  const surge = today.surge || [];
  document.getElementById("surge").innerHTML = surge.map(s =>
    `<div class="surge"><b>${esc(CAT[s.cat] || s.cat)}</b> 분야 부정 보도가 최근 ${s.days}일
     <b>${s.recent}건</b>으로, 그 이전 평소치의 <b>${s.ratio}배</b>입니다.</div>`).join("");

  // 오늘 확인할 것
  if (!items.length) {
    document.getElementById("list").innerHTML =
      '<div class="empty">오늘 확인할 부정 보도가 없습니다.</div>';
  } else {
    // 점수가 같으면 순위도 같아야 한다. 본 화면과 같은 규칙을 쓴다.
    const rank = [];
    items.forEach((it, i) => rank.push(
      i > 0 && items[i - 1].score === it.score ? rank[i - 1] : i + 1));

    // 항목을 한 덩어리로 감싸 괘선으로 나눈다. 상자를 겹치면 좁은 화면에서 자리를 먹는다.
    document.getElementById("list").innerHTML = '<div class="items">' + items.map((it, i) => {
      const art = byTitle[it.titles && it.titles[0]];
      const href = art && art.url ? art.url : null;
      const tag = href ? "a" : "div";
      const attr = href ? ` href="${esc(href)}" target="_blank" rel="noopener"` : "";
      // 소관 후보 부서 — 전체 화면에는 있는데 여기 없으면 반쪽이다.
      // 출근길에 보는 화면일수록 "누가 대응하나"가 바로 보여야 한다.
      const dept = DEPT[it.cat] || [];
      return `<${tag} class="item"${attr}>
        <div class="ti"><span class="rank">${rank[i]}</span>${esc(it.label)}</div>
        <div class="meta">
          <span class="st">${esc(it.state)}</span>
          <span>${esc(CAT[it.cat] || it.cat)}</span>
          <span>${esc((it.last || "").replaceAll("-", "."))}</span>
          ${it.count > 1 ? `<span>기사 ${it.count}건</span>` : ""}
          ${href ? '<span class="go">원문 ↗</span>' : ""}
          <span class="sc">${it.score}점</span>
        </div>
        ${dept.length ? `<div class="dept">소관 후보 <b>${esc(dept.slice(0, 2).join(" · "))}</b>${
          dept.length > 2 ? ` 외 ${dept.length - 2}곳` : ""}</div>` : ""}
      </${tag}>`;
    }).join("") + '</div>';
  }

  // 위 3건에 안 들어간 최근 부정 보도
  const shown = new Set();
  items.forEach(it => (it.titles || []).forEach(t => shown.add(t)));
  const rest = (d.items || [])
    .filter(a => a.senti === "부정" && !shown.has(a.title))
    .sort((a, b) => b.date.localeCompare(a.date))
    .slice(0, 8);

  if (rest.length) {
    document.getElementById("recentBox").style.display = "";
    document.getElementById("recent").innerHTML = rest.map(a =>
      `<a class="sub" href="${esc(a.url || "#")}" target="_blank" rel="noopener">
        <span class="d">${esc(a.date.replaceAll("-", "."))}</span>${esc(a.title)}</a>`).join("");
    document.getElementById("moreBtn").textContent = `펼쳐 보기 (${rest.length}건)`;
    document.getElementById("moreBtn").addEventListener("click", function () {
      const box = document.getElementById("recent");
      const open = box.style.display !== "none";
      box.style.display = open ? "none" : "";
      this.textContent = open ? `펼쳐 보기 (${rest.length}건)` : "접기";
    });
  }

  // 최근 2주 부정 보도 — 날짜가 빈 날도 자리를 지켜야 흐름이 왜곡되지 않는다
  const days = [];
  // toISOString()은 한국시간을 UTC로 바꿔 하루를 앞당긴다. 오늘 날짜는 직접 만든다.
  const t = new Date();
  const todayStr = t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0")
    + "-" + String(t.getDate()).padStart(2, "0");
  const base = (d.updated || "").slice(0, 10) || todayStr;
  const cur = new Date(base + "T00:00:00");
  cur.setDate(cur.getDate() - 13);
  for (let i = 0; i < 14; i++) {
    const k = cur.getFullYear() + "-" + String(cur.getMonth() + 1).padStart(2, "0")
      + "-" + String(cur.getDate()).padStart(2, "0");
    days.push(k);
    cur.setDate(cur.getDate() + 1);
  }
  const negBy = {};
  (d.items || []).forEach(a => {
    if (a.senti === "부정") negBy[a.date] = (negBy[a.date] || 0) + 1;
  });
  const vals = days.map(k => negBy[k] || 0);
  const max = Math.max(1, ...vals);
  if (vals.some(v => v > 0)) {
    document.getElementById("sparkBox").style.display = "";
    document.getElementById("spark").innerHTML = days.map((k, i) => {
      const v = vals[i];
      const h = v ? Math.max(6, Math.round(v / max * 100)) : 0;
      return `<div class="col"><div class="n">${v || ""}</div>` +
        `<div class="bar${v ? "" : " zero"}" style="height:${h}%"></div></div>`;
    }).join("");
    document.getElementById("sparkx").innerHTML = days.map((k, i) =>
      `<span>${i % 3 === 0 ? k.slice(5).replace("-", ".") : ""}</span>`).join("");
  }

  // 분야별 부정 비율 — 어느 분야를 먼저 봐야 하는지
  const CATS = ["교통", "환경", "행정", "문화관광", "산업경제", "안전", "복지"];
  const tot = {}, neg = {};
  (d.items || []).forEach(a => {
    tot[a.cat] = (tot[a.cat] || 0) + 1;
    if (a.senti === "부정") neg[a.cat] = (neg[a.cat] || 0) + 1;
  });
  const all = (d.items || []).length;
  const avg = all ? Math.round((d.items || []).filter(a => a.senti === "부정").length / all * 100) : 0;
  const rows = CATS.filter(c => (tot[c] || 0) >= 5)
    .map(c => ({ c, pct: Math.round((neg[c] || 0) / tot[c] * 100), n: neg[c] || 0, t: tot[c] }))
    .sort((a, b) => b.pct - a.pct).slice(0, 4);
  if (rows.length) {
    document.getElementById("catBox").style.display = "";
    document.getElementById("catCap").textContent = "자동 수집분 기준 · 전체 평균 " + avg + "%";
    document.getElementById("catBars").innerHTML = rows.map(r =>
      `<div class="hbar${r.pct <= avg ? " low" : ""}" title="전체 평균 ${avg}% 대비">
        <div class="t">${esc(CAT[r.c] || r.c)} <b>${r.pct}%</b>
          <span class="c">${r.n}건 / ${r.t}건</span></div>
        <div class="track"><div class="fill" style="width:${Math.max(3, r.pct)}%"></div></div>
      </div>`).join("");
  }

  // 근거 — 말로만 "매일 돈다"고 하지 않는다
  const o = d.ops;
  if (o && o.days) {
    document.getElementById("ops").innerHTML =
      `자동 수집 <b>${o.days}일 연속</b> · 실패 <b>${o.failures}회</b><br>매일 아침 6시에 갱신됩니다`;
  }
}
</script>
</body>
</html>
