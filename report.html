<!DOCTYPE html>
<!-- 주간 보고서 — 공문서 개조식 형식으로 언론보도 동향과 조치 필요 사항을 정리해 보여주는 화면 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화성시 언론보도 주간 동향 보고 — 핀포인트</title>
<link rel="stylesheet" href="pretendard.min.css">
<style>
  @page { size: A4; margin: 20mm 18mm; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Pretendard, 'Malgun Gothic', sans-serif; background: #E9EBE9;
    color: #101418; line-height: 1.62; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .bar { background: #2E4628; color: #fff; padding: 10px 18px; display: flex; gap: 12px;
    align-items: center; flex-wrap: wrap; font-size: 13px; }
  .bar .home { color: #cfe0c9; text-decoration: none; font-weight: 700; }
  .bar .home:hover { color: #fff; }
  .bar .sp { flex: 1; }
  .bar button, .bar select { font-family: inherit; font-size: 13px; padding: 5px 12px;
    border-radius: 5px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08);
    color: #fff; cursor: pointer; }
  .bar button:hover { background: rgba(255,255,255,.2); }
  .bar button.go { background: #fff; color: #2E4628; font-weight: 700; border-color: #fff; }

  .sheet { width: 210mm; margin: 18px auto; background: #fff; padding: 20mm 18mm;
    box-shadow: 0 2px 14px rgba(0,0,0,.13); }

  /* ── 공문서 머리 ── */
  .doc-title { text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 4px;
    padding-bottom: 4px; }
  .doc-rule { border-bottom: 3px double #101418; margin: 8px 0 14px; }
  table.info { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-bottom: 20px; }
  table.info th, table.info td { border: 1px solid #b9bfc4; padding: 5px 9px; }
  table.info th { background: #F2F4F2; width: 62px; font-weight: 700; text-align: center;
    letter-spacing: 3px; white-space: nowrap; }
  table.info td { width: 38%; }

  /* ── 개조식 항목 ── */
  h2 { font-size: 14.5px; font-weight: 800; margin: 22px 0 8px; }
  h2:first-of-type { margin-top: 0; }
  ul { list-style: none; margin: 0 0 4px 14px; }
  li { font-size: 12.5px; margin-bottom: 4px; text-indent: -15px; padding-left: 15px; }
  li::before { content: "○ "; color: #3A5631; font-weight: 700; }
  li ul { margin: 3px 0 5px 14px; }
  li li { font-size: 12px; color: #35404d; }
  li li::before { content: "- "; color: #7a8599; }
  b { font-weight: 800; }
  .neg { color: #A03D3D; }
  .pos { color: #2E4628; }

  /* ── 표 ── */
  table.grid { width: 100%; border-collapse: collapse; font-size: 11.5px; margin: 7px 0 4px; }
  table.grid th, table.grid td { border: 1px solid #b9bfc4; padding: 5px 8px; text-align: left;
    vertical-align: top; }
  table.grid thead th { background: #F2F4F2; text-align: center; font-weight: 700;
    white-space: nowrap; }
  table.grid td.n, table.grid th.n { text-align: right; font-variant-numeric: tabular-nums;
    white-space: nowrap; }
  table.grid td.c, table.grid th.c { text-align: center; white-space: nowrap; }
  table.grid tr.us td { background: #EFF4EE; font-weight: 800; }
  table.grid tr.sum td { background: #F8F9F8; font-weight: 800; }
  .up { color: #A03D3D; font-weight: 700; }
  .down { color: #2E4628; font-weight: 700; }
  .flat { color: #8a94a6; }
  .sub { color: #6b7686; font-size: 10.5px; display: block; margin-top: 1px; }
  a { color: inherit; }

  .cap { font-size: 10.5px; color: #6b7686; line-height: 1.7; margin: 3px 0 0 2px; }
  .cap b { color: #35404d; }

  .attach { margin-top: 24px; border-top: 1px solid #b9bfc4; padding-top: 10px; font-size: 12.5px; }
  .attach .t { font-weight: 800; letter-spacing: 3px; margin-bottom: 4px; }
  .attach ol { margin-left: 22px; font-size: 12px; }
  .attach li { text-indent: 0; padding-left: 0; margin-bottom: 2px; }
  .attach li::before { content: none; }

  .foot { margin-top: 18px; text-align: center; font-size: 10.5px; color: #8a94a6;
    border-top: 1px solid #e0e4e0; padding-top: 8px; }

  @media print {
    body { background: #fff; }
    .bar { display: none; }
    .sheet { width: auto; margin: 0; padding: 0; box-shadow: none; }
    h2 { break-after: avoid; }
    table, ul { break-inside: auto; }
    tr, li { break-inside: avoid; }
    .attach { break-before: auto; }
  }
  @media (max-width: 820px) {
    .sheet { width: auto; margin: 10px; padding: 18px 15px; }
    .doc-title { font-size: 17px; letter-spacing: 2px; }
  }
</style>
</head>
<body>

<div class="bar">
  <a class="home" href="index.html">← 대시보드</a>
  <select id="range">
    <option value="7">최근 7일</option>
    <option value="14">최근 14일</option>
    <option value="30">최근 30일</option>
  </select>
  <span class="sp"></span>
  <button id="mailBtn">✉ 메일 초안 열기</button>
  <button class="go" onclick="window.print()">🖨 인쇄 · PDF 저장</button>
</div>

<div class="sheet" id="sheet">불러오는 중…</div>

<script>
const CAT_LABEL = { 교통: "교통", 환경: "환경", 행정: "행정", 문화관광: "문화·관광",
  산업경제: "산업·경제", 안전: "안전", 복지: "복지" };
const CATS = Object.keys(CAT_LABEL);
let NEWS = [], LIVE = null, BENCH = null, DAYS = 7, MAIL = null;

const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
// 5.7%와 8% 가 섞이면 표가 어긋나 보인다. 소수 한 자리로 맞춘다.
const p1 = v => Number(v).toFixed(1);
const md = s => s ? s.slice(5).replace("-", ".") : "";
// toISOString()은 한국시간을 UTC로 바꿔 하루를 앞당긴다. 날짜는 직접 만든다.
const ymd = d => d.getFullYear() + "-"
  + String(d.getMonth() + 1).padStart(2, "0") + "-"
  + String(d.getDate()).padStart(2, "0");
// 공문서 날짜 표기 — 2026. 8. 25.
const kd = s => s ? `${s.slice(0, 4)}. ${Number(s.slice(5, 7))}. ${Number(s.slice(8, 10))}.` : "";

async function grab(url) {
  try { const r = await fetch(url, { cache: "no-store" }); return r.ok ? await r.json() : null; }
  catch (e) { return null; }
}

// 기준일은 오늘이 아니라 수집된 마지막 기사 날짜다.
// 수집이 하루 밀려도 보고 기간이 통째로 어긋나지 않게 하기 위해서다.
function slice_(days, endStr) {
  const end = endStr || NEWS.reduce((m, n) => n.date > m ? n.date : m, NEWS[0].date);
  const d = new Date(end + "T00:00:00");
  d.setDate(d.getDate() - (days - 1));
  const from = ymd(d);
  return { from, to: end, rows: NEWS.filter(n => n.date >= from && n.date <= end) };
}

function build() {
  const cur = slice_(DAYS);
  const pe = new Date(cur.from + "T00:00:00"); pe.setDate(pe.getDate() - 1);
  const prev = slice_(DAYS, ymd(pe));

  const neg = cur.rows.filter(n => n.senti === "부정");
  const pneg = prev.rows.filter(n => n.senti === "부정");
  const ratio = pct(neg.length, cur.rows.length);
  const pratio = pct(pneg.length, prev.rows.length);

  const ver = NEWS.filter(n => n.src !== "자동수집");
  const base = pct(ver.filter(n => n.senti === "부정").length, ver.length);
  const diff = Math.round((ratio - base) * 10) / 10;
  const wDiff = Math.round((ratio - pratio) * 10) / 10;

  const rows = CATS.map(c => {
    const a = cur.rows.filter(n => n.cat === c), b = prev.rows.filter(n => n.cat === c);
    return { c, n: a.length, neg: a.filter(x => x.senti === "부정").length,
             pneg: b.filter(x => x.senti === "부정").length };
  }).filter(r => r.n > 0);
  const byNeg = rows.slice().sort((a, b) => b.neg - a.neg || b.n - a.n);
  const topCat = rows.slice().sort((a, b) => b.n - a.n)[0];

  const kw = {};
  cur.rows.forEach(n => (n.kw || []).forEach(k => kw[k] = (kw[k] || 0) + 1));
  const topKw = Object.entries(kw).sort((a, b) => b[1] - a[1]).slice(0, 10);

  const issues = ((LIVE && LIVE.today && LIVE.today.items) || [])
    .filter(it => it.last >= cur.from).slice(0, 5);
  const surge = (LIVE && LIVE.today && LIVE.today.surge) || null;
  const bench = BENCH && Array.isArray(BENCH.cities) ? BENCH.cities : null;

  // 조치 필요 사항은 규칙으로 뽑는다. AI에 맡기면 없는 사실을 지어낼 수 있고 비용도 든다.
  const act = [];
  if (byNeg[0] && byNeg[0].neg > 0) {
    act.push(`<b>${CAT_LABEL[byNeg[0].c]}</b> 분야 부정 보도 <b>${byNeg[0].neg}건</b>에 대한 소관 부서 확인 및 사실관계 정리 필요`);
  }
  const spread = issues.filter(it => (it.sources || 1) >= 2);
  if (spread.length) {
    act.push(`<b>${spread.length}건</b>의 이슈가 <b>2개 이상 매체</b>로 확산 중 — 우선 대응 검토 필요`
      + `<ul>${spread.map(it => `<li>${esc(it.label)} (${it.sources}개 매체)</li>`).join("")}</ul>`);
  }
  if (surge && surge.cat) {
    act.push(`<b>${CAT_LABEL[surge.cat] || surge.cat}</b> 분야 부정 보도가 직전 대비 증가 추세 — 원인 점검 필요`);
  }
  const worse = rows.filter(r => r.neg - r.pneg >= 3);
  if (worse.length) {
    act.push(`직전 기간 대비 부정 보도가 3건 이상 늘어난 분야: `
      + worse.map(r => `<b>${CAT_LABEL[r.c]}</b>(+${r.neg - r.pneg})`).join(", "));
  }
  if (diff > 0.5) {
    act.push(`부정 비율이 평상시(${base}%)보다 <b class="neg">${Math.abs(diff)}%p 높음</b> — 전반적 대응 상황 점검 필요`);
  } else {
    act.push(`부정 비율은 평상시(${base}%) 대비 <b class="pos">${Math.abs(diff)}%p ${diff < -0.5 ? "낮은" : "비슷한"} 수준</b>으로, 현행 대응 기조 유지`);
  }
  act.push("부정으로 표시된 보도는 <b>담당자 원문 확인 후</b> 대응 여부 판단 필요 (AI 판정값이므로 확정값 아님)");

  const negSorted = neg.slice().sort((a, b) => b.date.localeCompare(a.date));
  let no = 0;
  const N = () => ++no;

  const html = `
  <div class="doc-title">화성시 언론보도 주간 동향 보고</div>
  <div class="doc-rule"></div>

  <table class="info">
    <tr><th>보고기간</th><td>${kd(cur.from)} ~ ${kd(cur.to)} (${DAYS}일간)</td>
        <th>작성일</th><td>${kd(ymd(new Date()))}</td></tr>
    <tr><th>자료출처</th><td>빅카인즈 검증본 · 구글 뉴스 RSS 자동수집</td>
        <th>작성방식</th><td>핀포인트 대시보드 자동 생성</td></tr>
  </table>

  <h2>${N()}. 보고 개요</h2>
  <ul>
    <li>보고기간 중 화성시 관련 언론보도는 총 <b>${cur.rows.length.toLocaleString()}건</b>이며,
        이 중 부정 보도는 <b class="neg">${neg.length}건(${p1(ratio)}%)</b>으로 집계됨</li>
    <li>사람이 선별한 검증본 ${ver.length.toLocaleString()}건 기준 평상시 부정 비율 <b>${p1(base)}%</b> 대비
        <b class="${diff < -0.5 ? "pos" : diff > 0.5 ? "neg" : ""}">${Math.abs(diff)}%p ${diff < -0.5 ? "낮은" : diff > 0.5 ? "높은" : "비슷한"} 수준</b>임</li>
    <li>직전 동일기간(${kd(prev.from)} ~ ${kd(prev.to)})은 ${prev.rows.length.toLocaleString()}건 중 부정 ${pneg.length}건(${p1(pratio)}%)으로,
        ${Math.abs(wDiff) < 0.1 ? "변동 없음" : `<b class="${wDiff > 0 ? "neg" : "pos"}">${Math.abs(wDiff)}%p ${wDiff > 0 ? "증가" : "감소"}</b>함`}</li>
    ${topCat ? `<li>보도량 최다 분야는 <b>${CAT_LABEL[topCat.c]}</b>(${topCat.n}건),
        부정 보도 최다 분야는 <b>${byNeg[0] && byNeg[0].neg ? CAT_LABEL[byNeg[0].c] + `(${byNeg[0].neg}건)` : "해당 없음"}</b>임</li>` : ""}
  </ul>

  <h2>${N()}. 주요 지표</h2>
  <table class="grid">
    <thead><tr><th>구분</th><th class="n">보고기간</th><th class="n">직전 기간</th>
      <th class="n">증감</th><th class="n">평상시 기준</th></tr></thead>
    <tbody>
      <tr><td>전체 보도</td><td class="n">${cur.rows.length.toLocaleString()}건</td>
        <td class="n">${prev.rows.length.toLocaleString()}건</td>
        <td class="n ${cur.rows.length > prev.rows.length ? "up" : cur.rows.length < prev.rows.length ? "down" : "flat"}">
          ${cur.rows.length === prev.rows.length ? "-" : (cur.rows.length > prev.rows.length ? "▲ " : "▼ ") + Math.abs(cur.rows.length - prev.rows.length)}</td>
        <td class="n flat">-</td></tr>
      <tr><td>부정 보도</td><td class="n">${neg.length}건</td><td class="n">${pneg.length}건</td>
        <td class="n ${neg.length > pneg.length ? "up" : neg.length < pneg.length ? "down" : "flat"}">
          ${neg.length === pneg.length ? "-" : (neg.length > pneg.length ? "▲ " : "▼ ") + Math.abs(neg.length - pneg.length)}</td>
        <td class="n flat">-</td></tr>
      <tr class="sum"><td>부정 비율</td><td class="n">${p1(ratio)}%</td><td class="n">${p1(pratio)}%</td>
        <td class="n ${wDiff > 0 ? "up" : wDiff < 0 ? "down" : "flat"}">
          ${Math.abs(wDiff) < 0.1 ? "-" : (wDiff > 0 ? "▲ " : "▼ ") + Math.abs(wDiff) + "%p"}</td>
        <td class="n">${p1(base)}% <span class="${diff < 0 ? "down" : diff > 0 ? "up" : "flat"}">(${diff > 0 ? "+" : ""}${diff}%p)</span></td></tr>
    </tbody>
  </table>
  <div class="cap">평상시 기준은 <b>빅카인즈 검증본 ${ver.length.toLocaleString()}건</b>(사람이 화성시 관련 여부를 선별한 자료)의 부정 비율임.</div>

  ${issues.length ? `
  <h2>${N()}. 중점 관리 이슈</h2>
  <table class="grid">
    <thead><tr><th class="c" style="width:30px">순위</th><th>사안</th>
      <th class="c" style="width:60px">분야</th><th class="c" style="width:46px">매체</th>
      <th class="c" style="width:68px">최근 보도</th><th class="n" style="width:44px">점수</th></tr></thead>
    <tbody>${issues.map((it, i) => `
      <tr><td class="c">${i > 0 && issues[i - 1].score === it.score ? i : i + 1}</td>
        <td>${esc(it.label)}${it.count > 1 ? `<span class="sub">동일 사안 ${it.count}건</span>` : ""}</td>
        <td class="c">${CAT_LABEL[it.cat] || it.cat || "-"}</td>
        <td class="c">${it.sources || 1}곳</td><td class="c">${it.last}</td>
        <td class="n">${it.score}</td></tr>`).join("")}</tbody>
  </table>
  <div class="cap">점수는 <b>최신성(45) · 매체 수(30) · 기사 수(15) · 지속성(10)</b>을 합산한 100점 만점 값으로, 계산은 코드가 수행하며 AI는 개입하지 않음.
    동점은 같은 순위로 표시하며 상하 배치는 우열이 아님.</div>
  ` : ""}

  <h2>${N()}. 분야별 동향</h2>
  <table class="grid">
    <thead><tr><th>분야</th><th class="n">보도</th><th class="n">부정</th>
      <th class="n">부정 비율</th><th class="n">직전 대비</th></tr></thead>
    <tbody>${byNeg.map(r => {
      const d = r.neg - r.pneg;
      return `<tr><td>${CAT_LABEL[r.c]}</td><td class="n">${r.n}</td><td class="n">${r.neg}</td>
        <td class="n">${p1(pct(r.neg, r.n))}%</td>
        <td class="n ${d > 0 ? "up" : d < 0 ? "down" : "flat"}">${d > 0 ? "▲ " + d : d < 0 ? "▼ " + Math.abs(d) : "-"}</td></tr>`;
    }).join("")}
    <tr class="sum"><td>계</td><td class="n">${cur.rows.length.toLocaleString()}</td>
      <td class="n">${neg.length}</td><td class="n">${p1(ratio)}%</td>
      <td class="n ${neg.length > pneg.length ? "up" : neg.length < pneg.length ? "down" : "flat"}">
        ${neg.length === pneg.length ? "-" : (neg.length > pneg.length ? "▲ " : "▼ ") + Math.abs(neg.length - pneg.length)}</td></tr>
    </tbody>
  </table>

  ${bench ? `
  <h2>${N()}. 인접 지자체 대조</h2>
  <table class="grid">
    <thead><tr><th>지자체</th><th class="n">표본</th><th class="n">부정</th><th class="n">부정 비율</th></tr></thead>
    <tbody>${bench.map(c => `<tr class="${c.name === "화성시" ? "us" : ""}">
      <td>${c.name}</td><td class="n">${c.count}건</td><td class="n">${c.neg}건</td>
      <td class="n">${p1(c.ratio)}%</td></tr>`).join("")}</tbody>
  </table>
  <div class="cap">${kd(BENCH.from)} ~ ${kd(BENCH.to)} 기사를 지자체별로 <b>동일 검색 방식으로 수집하여 동일 AI 판정</b>을 적용함.
    지자체당 표본이 ${Math.min(...bench.map(c => c.count))}~${Math.max(...bench.map(c => c.count))}건으로
    <b>정밀한 순위가 아닌 개략적 위치</b> 확인 목적임. 기사 수는 수집 시점에 좌우되므로 비율만 대조함.</div>
  ` : ""}

  <h2>${N()}. 조치 필요 사항</h2>
  <ul>${act.map(a => `<li>${a}</li>`).join("")}</ul>

  <div class="attach">
    <div class="t">붙 임</div>
    <ol>
      <li>부정 보도 목록 ${neg.length}건</li>
      <li>주요 키워드 현황</li>
    </ol>
  </div>

  <h2 style="margin-top:26px">붙임 1. 부정 보도 목록 (${neg.length}건)</h2>
  ${neg.length ? `<table class="grid">
    <thead><tr><th class="c" style="width:26px">연번</th><th class="c" style="width:46px">일자</th>
      <th class="c" style="width:60px">분야</th><th>제 목</th></tr></thead>
    <tbody>${negSorted.map((n, i) => `<tr>
      <td class="c">${i + 1}</td><td class="c">${md(n.date)}</td>
      <td class="c">${CAT_LABEL[n.cat] || n.cat}</td>
      <td>${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>` : esc(n.title)}
        ${n.summary ? `<span class="sub">${esc(n.summary)}</span>` : ""}</td></tr>`).join("")}
    </tbody></table>`
   : `<ul><li>보고기간 중 부정으로 분류된 보도 없음</li></ul>`}

  <h2>붙임 2. 주요 키워드 현황</h2>
  <table class="grid">
    <thead><tr><th class="c" style="width:26px">순위</th><th>키워드</th><th class="n" style="width:60px">언급</th>
      <th class="c" style="width:26px">순위</th><th>키워드</th><th class="n" style="width:60px">언급</th></tr></thead>
    <tbody>${Array.from({ length: Math.ceil(topKw.length / 2) }, (_, i) => {
      const a = topKw[i], b = topKw[i + Math.ceil(topKw.length / 2)];
      return `<tr><td class="c">${i + 1}</td><td>${esc(a[0])}</td><td class="n">${a[1]}회</td>
        <td class="c">${b ? i + 1 + Math.ceil(topKw.length / 2) : ""}</td>
        <td>${b ? esc(b[0]) : ""}</td><td class="n">${b ? b[1] + "회" : ""}</td></tr>`;
    }).join("")}</tbody>
  </table>

  <div class="cap" style="margin-top:16px">
    ※ 기사 제목·일자·요약만 수집하며 본문은 수집하지 않음. 분야 및 긍부정은 AI가 제목을 근거로 판정한 값으로,
    <b>사람이 검수한 정확도 수치는 확보되지 않았음.</b> 따라서 본 보고서의 부정 분류는 참고자료이며,
    대응 판단 시 원문 확인을 전제로 함. 검증본과 자동수집분은 수집 범위가 달라 건수는 상호 대조하지 않음.
    ${LIVE && LIVE.ops ? `자동 수집은 ${LIVE.ops.since}부터 ${LIVE.ops.runs}회 실행, 실패 ${LIVE.ops.failures}회.` : ""}
  </div>

  <div class="foot">핀포인트 · 화성시 AI·DATA 공모전 지정과제 16번 언론보도 대시보드${LIVE ? " · 데이터 갱신 " + LIVE.updated : ""}</div>`;

  // 메일 초안 — 서버 없이 담당자의 메일 프로그램을 열어 본문까지 채워 준다.
  MAIL = {
    subject: `[언론보도 주간 동향] ${cur.from} ~ ${cur.to}`,
    body: [
      `화성시 언론보도 주간 동향 보고`,
      `보고기간: ${cur.from} ~ ${cur.to} (${DAYS}일간)`, "",
      `□ 개요`,
      ` ○ 전체 보도 ${cur.rows.length.toLocaleString()}건, 부정 보도 ${neg.length}건(${ratio}%)`,
      ` ○ 평상시 기준 ${base}% 대비 ${Math.abs(diff)}%p ${diff < -0.5 ? "낮음" : diff > 0.5 ? "높음" : "비슷"}`,
      ` ○ 직전 동일기간 ${pratio}% 대비 ${Math.abs(wDiff)}%p ${wDiff > 0 ? "증가" : wDiff < 0 ? "감소" : "변동 없음"}`,
      bench ? ` ○ 인접 지자체 대조: ${bench.map(c => c.name + " " + c.ratio + "%").join(" / ")}` : "",
      "", `□ 중점 관리 이슈`,
      ...(issues.length
        ? issues.map((it, i) => ` ${i + 1}. ${it.label} (${CAT_LABEL[it.cat] || it.cat}, ${it.sources || 1}개 매체, ${it.score}점)`)
        : [" ○ 해당 없음"]),
      "", `□ 조치 필요 사항`,
      ...act.map(a => " ○ " + a.replace(/<[^>]+>/g, "")),
      "", `상세 내용은 대시보드에서 확인하실 수 있습니다.`,
      location.href.replace(/report\.html.*$/, ""),
    ].filter(x => x !== "").join("\n"),
  };
  return html;
}

function render() {
  document.getElementById("sheet").innerHTML = build();
}

(async () => {
  const base = await grab("news_data.json");
  if (!Array.isArray(base) || !base.length) {
    document.getElementById("sheet").textContent = "데이터를 불러오지 못했습니다.";
    return;
  }
  base.forEach(n => n.src = "검증본");
  NEWS = base;
  LIVE = await grab("news_live.json");
  if (LIVE && Array.isArray(LIVE.items)) {
    LIVE.items.forEach(n => n.src = "자동수집");
    NEWS = NEWS.concat(LIVE.items);
  }
  BENCH = await grab("benchmark.json");

  const q = new URLSearchParams(location.search).get("days");
  if (q && ["7", "14", "30"].includes(q)) DAYS = Number(q);
  const sel = document.getElementById("range");
  sel.value = String(DAYS);
  sel.onchange = () => { DAYS = Number(sel.value); render(); };
  document.getElementById("mailBtn").onclick = () => {
    if (!MAIL) return;
    location.href = "mailto:?subject=" + encodeURIComponent(MAIL.subject)
      + "&body=" + encodeURIComponent(MAIL.body);
  };
  render();
})();
</script>
</body>
</html>
