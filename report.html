<!DOCTYPE html>
<!-- 주간 동향 보고 — 공문서 작성 규정(항목기호·날짜·붙임·끝 표시)에 맞춰 언론보도 동향을 정리해 보여주는 화면 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화성시 언론보도 주간 동향 보고 — 핀포인트</title>
<link rel="stylesheet" href="pretendard.min.css">
<style>
  /* 여백은 「서식의 설계기준」이 아니라 보고서 실무 관행을 따른다.
     기안문 본문의 글꼴·여백을 정한 규정은 없다. */
  @page { size: A4; margin: 15mm 20mm; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Pretendard, 'Malgun Gothic', sans-serif; background: #E9EBE9;
    color: #101418; line-height: 1.6; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .bar { background: #2E4628; color: #fff; padding: 10px 18px; display: flex; gap: 12px;
    align-items: center; flex-wrap: wrap; font-size: 13px; }
  .bar .home { color: #cfe0c9; text-decoration: none; font-weight: 700; }
  .bar .home:hover { color: #fff; }
  .bar .sp { flex: 1; }
  .bar button, .bar select { font-family: inherit; font-size: 13px; padding: 5px 12px;
    border-radius: 5px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08);
    color: #fff; cursor: pointer; }
  .bar button:hover { background: rgba(255,255,255,.2); }
  .bar button.go { background: #fff; color: #2E4628; font-weight: 700; border-color: #fff; }
  .bar .hint { color: #b9cdb3; font-size: 11.5px; }

  .sheet { width: 210mm; margin: 18px auto; background: #fff; padding: 15mm 20mm;
    box-shadow: 0 2px 14px rgba(0,0,0,.13); }

  /* ── 문서 머리 ── */
  .doc-title { text-align: center; font-size: 19.5px; font-weight: 800; letter-spacing: 5px; }
  .doc-rule { border-bottom: 3px double #101418; margin: 7px 0 6px; }
  .doc-lead { font-size: 12.5px; margin: 12px 0 16px; }
  table.info { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-bottom: 18px; }
  table.info th, table.info td { border: 1px solid #aeb5ba; padding: 5px 9px; }
  table.info th { background: #F1F3F1; width: 66px; font-weight: 700; text-align: center;
    letter-spacing: 2px; white-space: nowrap; }
  table.info td { width: 37%; }

  /* ── 항목 기호 □ → ○ → - ── */
  h2 { font-size: 14px; font-weight: 800; margin: 20px 0 7px; }
  h2::before { content: "□ "; }
  h2:first-of-type { margin-top: 0; }
  h2 .cnt { font-weight: 400; font-size: 11.5px; color: #6b7686; letter-spacing: 0; }

  ul { list-style: none; margin: 0 0 5px 0; padding-left: 16px; }
  li { font-size: 12.5px; margin-bottom: 3px; text-indent: -16px; padding-left: 16px; }
  li::before { content: "○ "; color: #2E4628; font-weight: 700; }
  li ul { margin: 3px 0 5px 0; padding-left: 17px; }
  li li { font-size: 12px; color: #333c47; }
  li li::before { content: "- "; color: #7a8599; }
  b { font-weight: 800; }
  .neg { color: #A03D3D; }
  .pos { color: #2E4628; }

  /* 총평 — 통계 뒤에 해석 한 문단을 붙이는 것이 실무 보고서의 관행이다 */
  .verdict { font-size: 12.5px; line-height: 1.75; background: #F4F6F3;
    border: 1px solid #d5dfd1; border-radius: 3px; padding: 10px 13px 10px 30px;
    text-indent: -17px; }
  .verdict::before { content: "➡ "; color: #2E4628; font-weight: 800; }

  /* ── 표 ── */
  table.grid { width: 100%; border-collapse: collapse; font-size: 11.5px; margin: 6px 0 3px; }
  table.grid th, table.grid td { border: 1px solid #aeb5ba; padding: 5px 8px; text-align: left;
    vertical-align: top; }
  table.grid thead th { background: #F1F3F1; text-align: center; font-weight: 700; white-space: nowrap; }
  table.grid td.n, table.grid th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.grid td.c, table.grid th.c { text-align: center; white-space: nowrap; }
  table.grid tr.us td { background: #EEF3ED; font-weight: 800; }
  table.grid tr.sum td { background: #F7F8F7; font-weight: 800; }
  .up { color: #A03D3D; font-weight: 700; }
  .down { color: #2E4628; font-weight: 700; }
  .flat { color: #8a94a6; }
  .sub { color: #6b7686; font-size: 10.5px; display: block; margin-top: 1px; }
  a { color: inherit; }

  .cap { font-size: 10.5px; color: #6b7686; line-height: 1.65; margin: 3px 0 0 2px; }
  .cap::before { content: "※ "; }
  .cap b { color: #333c47; }

  /* 붙임 표시와 끝 표시 — 시행규칙 제4조제4항·제5항 */
  .attach { margin-top: 22px; font-size: 12.5px; line-height: 1.9; }
  .attach .row { display: flex; }
  .attach .lb { width: 46px; flex-shrink: 0; letter-spacing: 6px; font-weight: 700; }
  .attach .items { flex: 1; }
  .end { margin-top: 14px; font-size: 12.5px; font-weight: 700; padding-left: 4px; }

  /* 메일 본문 패널 — 메일 앱이 없거나 주소가 길어도 붙여넣을 수 있게 한다 */
  .mail-wrap { position: fixed; inset: 0; background: rgba(16,20,24,.55); display: none;
    align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .mail-wrap.on { display: flex; }
  .mail-box { background: #fff; border-radius: 8px; width: min(680px, 100%);
    max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,.3); }
  .mail-box .mh { padding: 14px 18px; border-bottom: 1px solid #dfe4dd;
    display: flex; align-items: center; gap: 10px; }
  .mail-box .mh b { font-size: 14.5px; color: #17335c; }
  .mail-box .mh .x { margin-left: auto; border: none; background: none; cursor: pointer;
    font-size: 19px; color: #8a94a6; line-height: 1; padding: 2px 6px; }
  .mail-box .ms { padding: 9px 18px; font-size: 11.5px; color: #6b7686;
    background: #F6F8F5; border-bottom: 1px solid #e6eaf1; line-height: 1.6; }
  .mail-box textarea { flex: 1; min-height: 260px; border: none; resize: none; outline: none;
    padding: 14px 18px; font-family: Consolas, 'Malgun Gothic', monospace;
    font-size: 12px; line-height: 1.65; color: #1A2332; }
  .mail-box .mf { padding: 12px 18px; border-top: 1px solid #dfe4dd; display: flex; gap: 7px;
    flex-wrap: wrap; align-items: center; }
  .mail-box .mf button { font-family: inherit; font-size: 12.5px; padding: 8px 13px;
    border-radius: 5px; cursor: pointer; border: 1px solid #c3d0c0; background: #fff; color: #2E4628; }
  .mail-box .mf button.pri { background: #2E4628; color: #fff; border-color: #2E4628; font-weight: 700; }
  .mail-box .mf .ok { margin-left: auto; align-self: center; font-size: 12px;
    color: #2E4628; font-weight: 700; opacity: 0; transition: opacity .2s; }
  .mail-box .mf .ok.on { opacity: 1; }
  @media print { .mail-wrap { display: none !important; } }

  .apx { page-break-before: always; }
  .apx h2 { margin-top: 0; }
  .foot { margin-top: 20px; text-align: center; font-size: 10px; color: #98a0a8;
    border-top: 1px solid #e0e4e0; padding-top: 7px; }

  @media print {
    body { background: #fff; }
    .bar { display: none; }
    .sheet { width: auto; margin: 0; padding: 0; box-shadow: none; }
    h2 { break-after: avoid; }
    tr, li, .verdict { break-inside: avoid; }
  }
  @media (max-width: 820px) {
    .sheet { width: auto; margin: 10px; padding: 18px 15px; }
    .doc-title { font-size: 16px; letter-spacing: 2px; }
  }
</style>
</head>
<body>

<div class="bar">
  <a class="home" href="index.html">← 대시보드</a>
  <select id="range">
    <option value="7">최근 7일</option>
    <option value="14">최근 14일</option>
    <option value="30">최근 30일</option>
  </select>
  <span class="sp"></span>
  <span class="hint">공문서 작성 규정에 맞춘 내부보고 서식</span>
  <button id="mailBtn">✉ 메일 초안 열기</button>
  <button class="go" onclick="window.print()">🖨 인쇄 · PDF 저장</button>
</div>

<div class="sheet" id="sheet">불러오는 중…</div>

<div class="mail-wrap" id="mailWrap">
  <div class="mail-box">
    <div class="mh"><b>메일 보고 초안</b><button class="x" id="mailClose">×</button></div>
    <div class="ms">아래 내용을 복사해 메일에 붙여 넣으십시오.
      <b>Gmail</b>·<b>Outlook</b>은 브라우저에서 바로 열리고,
      <b>메일 앱</b>은 이 PC에 기본 메일 프로그램이 지정돼 있어야 열립니다.</div>
    <textarea id="mailText" readonly></textarea>
    <div class="mf">
      <button class="pri" id="mailCopy">본문 복사</button>
      <button id="mailGmail">Gmail로 열기</button>
      <button id="mailOutlook">Outlook으로 열기</button>
      <button id="mailOpen">메일 앱</button>
      <span class="ok" id="mailOk">복사했습니다</span>
    </div>
  </div>
</div>

<script>
const CAT_LABEL = { 교통: "교통", 환경: "환경", 행정: "행정", 문화관광: "문화·관광",
  산업경제: "산업·경제", 안전: "안전", 복지: "복지" };
const CATS = Object.keys(CAT_LABEL);
let NEWS = [], LIVE = null, BENCH = null, DAYS = 7, MAIL = null;

const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
const p1 = v => Number(v).toFixed(1);
// toISOString()은 한국시간을 UTC로 바꿔 하루를 앞당긴다. 날짜는 직접 만든다.
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
  + "-" + String(d.getDate()).padStart(2, "0");
// 공문서 날짜 표기 — 2026. 8. 25. (0을 쓰지 않고 끝에도 온점)
const kd = s => s ? `${s.slice(0, 4)}. ${+s.slice(5, 7)}. ${+s.slice(8, 10)}.` : "";
// 같은 해 안의 기간은 뒤쪽 연도를 생략한다. 물결표는 앞뒤를 붙여 쓴다.
const kspan = (a, b) => a.slice(0, 4) === b.slice(0, 4)
  ? `${kd(a)}~${+b.slice(5, 7)}. ${+b.slice(8, 10)}.` : `${kd(a)}~${kd(b)}`;
const md = s => s ? `${+s.slice(5, 7)}. ${+s.slice(8, 10)}.` : "";
const updown = (n, unit) => n === 0 ? '<span class="flat">-</span>'
  : `<span class="${n > 0 ? "up" : "down"}">${Math.abs(n)}${unit || ""}${n > 0 ? "↑" : "↓"}</span>`;

async function grab(url) {
  try { const r = await fetch(url, { cache: "no-store" }); return r.ok ? await r.json() : null; }
  catch (e) { return null; }
}

// 기준일은 오늘이 아니라 수집된 마지막 기사 날짜다.
// 수집이 하루 밀려도 보고 기간이 통째로 어긋나지 않게 하기 위해서다.
function slice_(days, endStr) {
  const end = endStr || NEWS.reduce((m, n) => n.date > m ? n.date : m, NEWS[0].date);
  const d = new Date(end + "T00:00:00");
  d.setDate(d.getDate() - (days - 1));
  const from = ymd(d);
  return { from, to: end, rows: NEWS.filter(n => n.date >= from && n.date <= end) };
}

function build() {
  const cur = slice_(DAYS);
  const pe = new Date(cur.from + "T00:00:00"); pe.setDate(pe.getDate() - 1);
  const prev = slice_(DAYS, ymd(pe));

  const neg = cur.rows.filter(n => n.senti === "부정");
  const pos = cur.rows.filter(n => n.senti === "긍정");
  const pneg = prev.rows.filter(n => n.senti === "부정");
  const ratio = pct(neg.length, cur.rows.length);
  const pratio = pct(pneg.length, prev.rows.length);

  const ver = NEWS.filter(n => n.src !== "자동수집");
  const base = pct(ver.filter(n => n.senti === "부정").length, ver.length);
  const diff = Math.round((ratio - base) * 10) / 10;
  const wDiff = Math.round((ratio - pratio) * 10) / 10;
  const lvl = diff < -0.5 ? "낮은" : diff > 0.5 ? "높은" : "비슷한";

  const rows = CATS.map(c => {
    const a = cur.rows.filter(n => n.cat === c), b = prev.rows.filter(n => n.cat === c);
    return { c, n: a.length, neg: a.filter(x => x.senti === "부정").length,
             pneg: b.filter(x => x.senti === "부정").length };
  }).filter(r => r.n > 0);
  const byNeg = rows.slice().sort((a, b) => b.neg - a.neg || b.n - a.n);
  const topCat = rows.slice().sort((a, b) => b.n - a.n)[0];

  const kw = {};
  cur.rows.forEach(n => (n.kw || []).forEach(k => kw[k] = (kw[k] || 0) + 1));
  const topKw = Object.entries(kw).sort((a, b) => b[1] - a[1]).slice(0, 10);

  const issues = ((LIVE && LIVE.today && LIVE.today.items) || [])
    .filter(it => it.last >= cur.from).slice(0, 5);
  const spread = issues.filter(it => (it.sources || 1) >= 2);
  const surge = (LIVE && LIVE.today && LIVE.today.surge) || null;
  const bench = BENCH && Array.isArray(BENCH.cities) ? BENCH.cities : null;
  const us = bench && bench.find(c => c.name === "화성시");
  const rank = bench
    ? bench.slice().sort((a, b) => a.ratio - b.ratio).findIndex(c => c.name === "화성시") + 1 : 0;

  // 총평 — 숫자를 나열하는 데서 그치지 않고 한 문단으로 해석해 주는 것이 실무 보고서의 관행이다.
  const verdict = [
    `보고기간 중 부정 보도 비율은 <b>${p1(ratio)}%</b>입니다. 검증본 참고선 ${p1(base)}%와는 ${Math.abs(diff)}%p 차이가 있으나 <b>수집 방식이 달라 곧바로 견줄 수 없습니다.</b>`,
    `직전 기간(${p1(pratio)}%)과 견주어 ${Math.abs(wDiff) < 0.1 ? "변동이 없음" : `<b class="${wDiff > 0 ? "neg" : "pos"}">${Math.abs(wDiff)}%p ${wDiff > 0 ? "증가" : "감소"}</b>함`}.`,
    byNeg[0] && byNeg[0].neg
      ? `부정 보도는 <b>${CAT_LABEL[byNeg[0].c]}</b> 분야에 ${byNeg[0].neg}건으로 가장 많이 집중되어 해당 분야 대응 상황 점검이 필요함.`
      : `특정 분야에 부정 보도가 집중된 정황은 확인되지 않음.`,
    spread.length ? `<b>${spread.length}건</b>의 사안이 2개 이상 매체로 확산되고 있어 우선 대응 검토가 요구됨.` : "",
    us && bench ? `인접 지자체 탐색 표본에서는 ${us.count}건 중 ${us.neg}건이 부정으로 판정됨. <b>표본이 작아 지자체 간 순위 해석은 하지 않음.</b>` : "",
  ].filter(Boolean).join(" ");

  // 대응 필요사항 — 규칙으로 뽑는다. AI에 맡기면 없는 사실을 지어낼 수 있고 비용도 든다.
  const act = [];
  if (byNeg[0] && byNeg[0].neg > 0)
    act.push(`<b>${CAT_LABEL[byNeg[0].c]}</b> 분야 부정 보도 ${byNeg[0].neg}건에 대한 소관 부서 확인 및 사실관계 정리 필요`);
  if (spread.length)
    act.push(`2개 이상 매체 확산 사안 ${spread.length}건에 대한 우선 대응 검토 필요`
      + `<ul>${spread.map(it => `<li>${esc(it.label)} (${it.sources}개 매체, ${it.score}점)</li>`).join("")}</ul>`);
  if (surge && surge.cat)
    act.push(`<b>${CAT_LABEL[surge.cat] || surge.cat}</b> 분야 부정 보도 증가 추세에 따른 원인 점검 필요`);
  const worse = rows.filter(r => r.neg - r.pneg >= 3);
  if (worse.length)
    act.push(`직전 기간 대비 부정 보도 3건 이상 증가 분야: `
      + worse.map(r => `<b>${CAT_LABEL[r.c]}</b>(${r.neg - r.pneg}건↑)`).join(", ") + ` — 추이 관찰 필요`);
  // 검증되지 않은 비교를 근거로 행정 권고를 내지 않는다. 확인된 사실만 적는다.
  act.push(`직전 기간(${p1(pratio)}%) 대비 ${Math.abs(wDiff) < 0.1 ? "변동 없음" : Math.abs(wDiff) + "%p " + (wDiff > 0 ? "증가" : "감소")} `
    + `— <b>같은 수집 방식이 유지된 기간끼리의 비교</b>이므로 이 값만 추세 판단에 사용`);
  act.push(`검증본 참고선(${p1(base)}%)은 <b>수집 방식이 달라 직접 대조 불가</b>. 참고값으로만 확인`);
  act.push(`분야 및 보도흐름은 <b>AI가 제목만 보고 판정한 값</b>이며 사람 검수 정확도가 확보되지 않음. `
    + `부정으로 분류된 보도는 <b>담당자 원문 확인 후</b> 대응 여부 판단 필요`);

  const negSorted = neg.slice().sort((a, b) => b.date.localeCompare(a.date));
  const gen = ymd(new Date());

  const html = `
  <div class="doc-title">화성시 언론보도 주간 동향 보고</div>
  <div class="doc-rule"></div>
  <div class="doc-lead">화성시 관련 언론보도 수집·분석 결과를 정리하여 붙임과 같이 보고드림.</div>

  <table class="info">
    <tr><th>보고기간</th><td>${kspan(cur.from, cur.to)} (${DAYS}일간)</td>
        <th>작성일</th><td>${kd(gen)}</td></tr>
    <tr><th>자료출처</th><td>빅카인즈 검증본 · 구글 뉴스 RSS</td>
        <th>작성방식</th><td>핀포인트 대시보드 자동 생성</td></tr>
  </table>

  <h2>개  요</h2>
  <ul>
    <li>대상기간: ${kspan(cur.from, cur.to)} (${DAYS}일간)</li>
    <li>수집건수: 총 <b>${cur.rows.length.toLocaleString()}건</b>
        (직전 기간 ${prev.rows.length.toLocaleString()}건, ${updown(cur.rows.length - prev.rows.length, "건")})</li>
    <li>보도흐름: 긍정 ${pos.length}건 · 중립 ${(cur.rows.length - pos.length - neg.length)}건 ·
        <b class="neg">부정 ${neg.length}건(${p1(ratio)}%)</b></li>
    ${topCat ? `<li>최다 보도 분야: <b>${CAT_LABEL[topCat.c]}</b> ${topCat.n}건 ·
        최다 부정 분야: <b>${byNeg[0] && byNeg[0].neg ? `${CAT_LABEL[byNeg[0].c]} ${byNeg[0].neg}건` : "해당 없음"}</b></li>` : ""}
  </ul>

  <h2>주간 총평</h2>
  <div class="verdict">${verdict}</div>

  <h2>주요 지표</h2>
  <table class="grid">
    <thead><tr><th>구  분</th><th class="n">보고기간</th><th class="n">직전 기간</th>
      <th class="c">증  감</th><th class="c">검증본 참고선</th></tr></thead>
    <tbody>
      <tr><td>전체 보도</td><td class="n">${cur.rows.length.toLocaleString()}건</td>
        <td class="n">${prev.rows.length.toLocaleString()}건</td>
        <td class="c">${updown(cur.rows.length - prev.rows.length, "건")}</td>
        <td class="c flat">-</td></tr>
      <tr><td>부정 보도</td><td class="n">${neg.length}건</td><td class="n">${pneg.length}건</td>
        <td class="c">${updown(neg.length - pneg.length, "건")}</td><td class="c flat">-</td></tr>
      <tr class="sum"><td>부정 비율</td><td class="n">${p1(ratio)}%</td><td class="n">${p1(pratio)}%</td>
        <td class="c">${updown(wDiff, "%p")}</td>
        <td class="c">${p1(base)}% <span class="${diff < 0 ? "down" : diff > 0 ? "up" : "flat"}">(${diff > 0 ? "+" : ""}${diff}%p)</span></td></tr>
    </tbody>
  </table>
  <div class="cap">검증본 참고선은 <b>빅카인즈 검증본 ${ver.length.toLocaleString()}건</b>(사람이 화성시 관련 여부를 선별한 자료)의 부정 비율임.
    <b>수집 방식이 달라 자동수집분과 직접 대조할 수 없으며 참고값임.</b></div>

  ${issues.length ? `
  <h2>중점 관리 이슈</h2>
  <table class="grid">
    <thead><tr><th class="c" style="width:28px">순위</th><th>사  안</th>
      <th class="c" style="width:58px">분  야</th><th class="c" style="width:44px">매체</th>
      <th class="c" style="width:62px">최근 보도</th><th class="n" style="width:40px">점수</th></tr></thead>
    <tbody>${issues.map((it, i) => `
      <tr><td class="c">${i > 0 && issues[i - 1].score === it.score ? i : i + 1}</td>
        <td>${esc(it.label)}${it.count > 1 ? `<span class="sub">동일 사안 ${it.count}건</span>` : ""}</td>
        <td class="c">${CAT_LABEL[it.cat] || it.cat || "-"}</td>
        <td class="c">${it.sources || 1}곳</td><td class="c">${md(it.last)}</td>
        <td class="n">${it.score}</td></tr>`).join("")}</tbody>
  </table>
  <div class="cap">점수는 <b>최신성(45)·매체 수(30)·기사 수(15)·지속성(10)</b>을 합산한 100점 만점 값으로 계산은 코드가 수행하며 AI는 개입하지 않음.
    동점은 같은 순위로 표시하고 상하 배치는 우열이 아님.</div>
  ` : ""}

  <h2>분야별 보도 현황</h2>
  <table class="grid">
    <thead><tr><th>분  야</th><th class="n">보도</th><th class="n">구성비</th>
      <th class="n">부정</th><th class="n">부정 비율</th><th class="c">직전 대비</th></tr></thead>
    <tbody>${byNeg.map(r => `<tr><td>${CAT_LABEL[r.c]}</td>
        <td class="n">${r.n}건</td><td class="n">${p1(pct(r.n, cur.rows.length))}%</td>
        <td class="n">${r.neg}건</td><td class="n">${p1(pct(r.neg, r.n))}%</td>
        <td class="c">${updown(r.neg - r.pneg, "건")}</td></tr>`).join("")}
    <tr class="sum"><td>계</td><td class="n">${cur.rows.length.toLocaleString()}건</td><td class="n">100.0%</td>
      <td class="n">${neg.length}건</td><td class="n">${p1(ratio)}%</td>
      <td class="c">${updown(neg.length - pneg.length, "건")}</td></tr>
    </tbody>
  </table>

  ${bench ? `
  <h2>인접 지자체 대조</h2>
  <table class="grid">
    <thead><tr><th>지자체</th><th class="n">표  본</th><th class="n">부  정</th><th class="n">부정 비율</th></tr></thead>
    <tbody>${bench.map(c => `<tr class="${c.name === "화성시" ? "us" : ""}">
      <td>${c.name}</td><td class="n">${c.count}건</td><td class="n">${c.neg}건</td>
      <td class="n">${p1(c.ratio)}%</td></tr>`).join("")}</tbody>
  </table>
  <div class="cap">${kspan(BENCH.from, BENCH.to)} 기사를 지자체별로 <b>동일 검색 방식으로 수집하여 동일 AI 판정</b>을 적용함.
    지자체당 표본이 ${Math.min(...bench.map(c => c.count))}~${Math.max(...bench.map(c => c.count))}건이며 <b>사람 검수를 거치지 않음.</b>
    Fisher 정확검정 결과 화성시와 수원·용인의 차이는 <b>유의하지 않으며</b>(p=0.36, p=0.53) 성남시와의 차이만 유의함(p=0.004).
    <b>지자체 성과 비교가 아니라 동일 방법으로 대조 통계를 산출할 수 있음을 확인한 탐색 자료임.</b></div>
  ` : ""}

  <h2>대응 필요사항</h2>
  <ul>${act.map(a => `<li>${a}</li>`).join("")}</ul>

  <h2>향후 계획</h2>
  <ul>
    <li>매일 06:00 자동 수집 및 분류 지속 시행${LIVE && LIVE.ops ? ` (${kd(LIVE.ops.since)} 이후 ${LIVE.ops.runs}회 실행, 실패 ${LIVE.ops.failures}회)` : ""}</li>
    <li>부정 보도 사안별 소관 부서 지정 및 대응 결과 회신 요청 예정</li>
    <li>분류 정확도에 대한 사람 검수 절차 마련 예정</li>
  </ul>

  <div class="attach">
    <div class="row"><span class="lb">붙임</span><span class="items">
      1. 주간 부정 보도 목록 1부.<br>
      2. 주요 키워드 현황 1부.</span></div>
  </div>
  <div class="end">끝.</div>

  <div class="apx">
    <h2>붙임 1. 주간 부정 보도 목록 <span class="cnt">(${kspan(cur.from, cur.to)} · ${neg.length}건)</span></h2>
    ${neg.length ? `<table class="grid">
      <thead><tr><th class="c" style="width:26px">연번</th><th class="c" style="width:48px">보도일자</th>
        <th class="c" style="width:58px">분  야</th><th>보도제목 및 주요내용</th></tr></thead>
      <tbody>${negSorted.map((n, i) => `<tr>
        <td class="c">${i + 1}</td><td class="c">${md(n.date)}</td>
        <td class="c">${CAT_LABEL[n.cat] || n.cat}</td>
        <td>${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>` : esc(n.title)}
          ${n.summary ? `<span class="sub">${esc(n.summary)}</span>` : ""}</td></tr>`).join("")}
      </tbody></table>
      <div class="cap">보도제목을 누르면 원문으로 연결됨. 요약문은 제목을 근거로 AI가 작성한 것으로 본문을 읽고 쓴 것이 아님.</div>`
     : `<ul><li>보고기간 중 부정으로 분류된 보도 없음</li></ul>`}

    <h2>붙임 2. 주요 키워드 현황</h2>
    <table class="grid">
      <thead><tr><th class="c" style="width:26px">순위</th><th>키워드</th><th class="n" style="width:54px">언급</th>
        <th class="c" style="width:26px">순위</th><th>키워드</th><th class="n" style="width:54px">언급</th></tr></thead>
      <tbody>${(() => {
        const h = Math.ceil(topKw.length / 2);
        return Array.from({ length: h }, (_, i) => {
          const a = topKw[i], b = topKw[i + h];
          return `<tr><td class="c">${i + 1}</td><td>${esc(a[0])}</td><td class="n">${a[1]}회</td>
            <td class="c">${b ? i + 1 + h : ""}</td><td>${b ? esc(b[0]) : ""}</td>
            <td class="n">${b ? b[1] + "회" : ""}</td></tr>`;
        }).join("");
      })()}</tbody>
    </table>
    <div class="end">끝.</div>

    <div class="cap" style="margin-top:16px">
      기사 제목·일자만 수집하며 본문은 수집하지 않음. 분야 및 보도흐름은 AI가 제목을 근거로 판정한 값으로
      <b>사람이 검수한 정확도 수치는 확보되지 않았음.</b> 따라서 본 보고서의 부정 분류는 참고자료이며 대응 판단 시 원문 확인을 전제로 함.
      검증본과 자동수집분은 수집 범위가 달라 건수는 상호 대조하지 않고 비율만 대조함.
    </div>
    <div class="foot">핀포인트 · 화성시 AI·DATA 공모전 지정과제 16번 언론보도 대시보드${LIVE ? " · 데이터 갱신 " + LIVE.updated : ""}</div>
  </div>`;

  // 메일 초안 — 서버 없이 담당자의 메일 프로그램을 열어 본문까지 채워 준다.
  const strip = s => s.replace(/<[^>]+>/g, "");
  MAIL = {
    subject: `[언론보도 주간 동향] ${kspan(cur.from, cur.to)}`,
    // 메일 앱에 넘길 짧은 판. 한글은 주소로 바뀌면 글자당 9자가 되어 금방 한계를 넘는다.
    brief: [
      `보고기간: ${kspan(cur.from, cur.to)}`,
      `전체 ${cur.rows.length.toLocaleString()}건 / 부정 ${neg.length}건(${p1(ratio)}%)`,
      `검증본 참고선 ${p1(base)}% (직접 대조 불가, 참고값)`,
      issues.length ? `중점 이슈: ${issues[0].label}` : "",
      "", "상세 내용은 대시보드에서 확인하실 수 있음.",
      location.href.replace(/report\.html.*$/, ""),
    ].filter(Boolean).join("\n"),
    body: [
      "화성시 언론보도 주간 동향 보고", "",
      `보고기간: ${kspan(cur.from, cur.to)} (${DAYS}일간)`,
      `작 성 일: ${kd(gen)}`, "",
      "□ 개  요",
      ` ○ 수집건수: 총 ${cur.rows.length.toLocaleString()}건 (직전 기간 ${prev.rows.length.toLocaleString()}건)`,
      ` ○ 보도흐름: 긍정 ${pos.length}건 · 중립 ${cur.rows.length - pos.length - neg.length}건 · 부정 ${neg.length}건(${p1(ratio)}%)`,
      ` ○ 검증본 참고선 ${p1(base)}% (수집 방식이 달라 직접 대조 불가)`,
      bench ? ` ○ 인접 지자체 대조: ${bench.map(c => `${c.name} ${p1(c.ratio)}%`).join(" / ")}` : "",
      "", "□ 주간 총평", " " + strip(verdict),
      "", "□ 중점 관리 이슈",
      ...(issues.length
        ? issues.map((it, i) => ` ${i + 1}. ${it.label} (${CAT_LABEL[it.cat] || it.cat}, ${it.sources || 1}개 매체, ${it.score}점)`)
        : [" ○ 해당 없음"]),
      "", "□ 대응 필요사항",
      ...act.map(a => " ○ " + strip(a).replace(/\s+/g, " ").trim()),
      "", "상세 내용은 대시보드에서 확인하실 수 있음.",
      location.href.replace(/report\.html.*$/, ""), "", "끝.",
    ].filter(x => x !== "").join("\n"),
  };
  return html;
}

function render() { document.getElementById("sheet").innerHTML = build(); }

(async () => {
  const base = await grab("news_data.json");
  if (!Array.isArray(base) || !base.length) {
    document.getElementById("sheet").textContent = "데이터를 불러오지 못했습니다.";
    return;
  }
  base.forEach(n => n.src = "검증본");
  NEWS = base;
  LIVE = await grab("news_live.json");
  if (LIVE && Array.isArray(LIVE.items)) {
    LIVE.items.forEach(n => n.src = "자동수집");
    NEWS = NEWS.concat(LIVE.items);
  }
  BENCH = await grab("benchmark.json");

  const q = new URLSearchParams(location.search).get("days");
  if (q && ["7", "14", "30"].includes(q)) DAYS = Number(q);
  const sel = document.getElementById("range");
  sel.value = String(DAYS);
  sel.onchange = () => { DAYS = Number(sel.value); render(); };
  const wrap = document.getElementById("mailWrap");
  const okTag = document.getElementById("mailOk");
  const close = () => wrap.classList.remove("on");

  document.getElementById("mailBtn").onclick = () => {
    if (!MAIL) return;
    document.getElementById("mailText").value = MAIL.subject + "\n\n" + MAIL.body;
    okTag.classList.remove("on");
    wrap.classList.add("on");
  };
  document.getElementById("mailClose").onclick = close;
  wrap.onclick = e => { if (e.target === wrap) close(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

  document.getElementById("mailCopy").onclick = async () => {
    const ta = document.getElementById("mailText");
    try {
      await navigator.clipboard.writeText(ta.value);
    } catch (e) {
      // 클립보드 권한이 없는 환경에서는 직접 선택해 준다
      ta.removeAttribute("readonly"); ta.select(); document.execCommand("copy");
      ta.setAttribute("readonly", "");
    }
    okTag.classList.add("on");
    setTimeout(() => okTag.classList.remove("on"), 2200);
  };

  // 웹 메일은 브라우저만 있으면 열린다. 기본 메일 프로그램이 없어도 쓸 수 있다.
  const openWeb = url => {
    const w = window.open(url, "_blank", "noopener");
    if (!w) alert("팝업이 막혀 있습니다. 주소창 오른쪽에서 팝업을 허용해 주십시오.");
  };
  document.getElementById("mailGmail").onclick = () => openWeb(
    "https://mail.google.com/mail/?view=cm&fs=1&su=" + encodeURIComponent(MAIL.subject)
    + "&body=" + encodeURIComponent(MAIL.body));
  document.getElementById("mailOutlook").onclick = () => openWeb(
    "https://outlook.office.com/mail/deeplink/compose?subject=" + encodeURIComponent(MAIL.subject)
    + "&body=" + encodeURIComponent(MAIL.body));

  // 기본 메일 프로그램이 없으면 윈도우가 이 요청을 조용히 버린다. 그래서 안내를 남긴다.
  document.getElementById("mailOpen").onclick = () => {
    location.href = "mailto:?subject=" + encodeURIComponent(MAIL.subject)
      + "&body=" + encodeURIComponent(MAIL.brief);
    setTimeout(() => {
      if (!document.hidden) {
        const ms = document.querySelector(".mail-box .ms");
        ms.innerHTML = "이 PC에 <b>기본 메일 프로그램이 지정돼 있지 않은 것 같습니다.</b> "
          + "위의 <b>Gmail로 열기</b>나 <b>본문 복사</b>를 쓰시면 됩니다.";
        ms.style.color = "#A03D3D";
      }
    }, 1400);
  };
  render();
})();
</script>
</body>
</html>
