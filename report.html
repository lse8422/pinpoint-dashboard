<!DOCTYPE html>
<!-- 주간 보고서 — 회의에 그대로 들고 갈 수 있는 문서 형태로 지표를 정리해 보여주는 화면 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화성시 언론보도 주간 보고 — 핀포인트</title>
<link rel="stylesheet" href="pretendard.min.css">
<style>
  @page { size: A4; margin: 16mm 14mm; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Pretendard, 'Malgun Gothic', sans-serif; background: #EEF0EE;
    color: #1A2332; line-height: 1.6; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .bar { background: #3A5631; color: #fff; padding: 10px 18px; display: flex; gap: 14px;
    align-items: center; flex-wrap: wrap; font-size: 13px; }
  .bar .home { color: #cfe0c9; text-decoration: none; font-weight: 700; }
  .bar .home:hover { color: #fff; }
  .bar .sp { flex: 1; }
  .bar button, .bar select { font-family: inherit; font-size: 13px; padding: 5px 12px;
    border-radius: 6px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08);
    color: #fff; cursor: pointer; }
  .bar button:hover { background: rgba(255,255,255,.2); }
  .bar button.go { background: #fff; color: #3A5631; font-weight: 700; border-color: #fff; }

  .sheet { width: 210mm; min-height: 297mm; margin: 18px auto; background: #fff;
    padding: 16mm 14mm; box-shadow: 0 2px 14px rgba(0,0,0,.12); }

  .head { border-bottom: 2.5px solid #3A5631; padding-bottom: 9px; margin-bottom: 16px; }
  .head h1 { font-size: 21px; letter-spacing: -.02em; color: #17335c; }
  .head .meta { margin-top: 6px; font-size: 11.5px; color: #6b7686;
    display: flex; gap: 16px; flex-wrap: wrap; }
  .head .meta b { color: #3A5631; }

  h2 { font-size: 14px; color: #3A5631; margin: 20px 0 8px; padding-left: 9px;
    border-left: 4px solid #3A5631; }
  h2:first-of-type { margin-top: 0; }

  .lead { background: #F2F6F1; border: 1px solid #d8e3d5; border-radius: 5px;
    padding: 12px 15px; font-size: 13px; line-height: 1.8; }
  .lead b { color: #2C4526; }
  .lead .neg { color: #A03D3D; font-weight: 700; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 7px 9px; border-bottom: 1px solid #e6eaf1; text-align: left;
    vertical-align: top; }
  thead th { background: #F4F6F4; border-bottom: 1.5px solid #c3d0c0; color: #3A5631;
    font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.c, th.c { text-align: center; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  .us td { background: #F2F6F1; font-weight: 700; }
  .up { color: #A03D3D; font-weight: 700; }
  .down { color: #3A5631; font-weight: 700; }
  .flat { color: #8a94a6; }
  .muted { color: #8a94a6; }

  .kpis { display: flex; gap: 9px; }
  .kpi { flex: 1; border: 1px solid #dfe4dd; border-radius: 5px; padding: 10px 12px; }
  .kpi .k { font-size: 11px; color: #6b7686; }
  .kpi .v { font-size: 22px; font-weight: 800; color: #17335c; line-height: 1.25;
    font-variant-numeric: tabular-nums; margin-top: 2px; }
  .kpi .v.warn { color: #A03D3D; }
  .kpi .s { font-size: 10.5px; color: #8a94a6; margin-top: 2px; }

  .art { font-size: 12px; }
  .art .t { font-weight: 600; color: #17335c; }
  .art .t a { color: inherit; text-decoration: none; }
  .art .t a:hover { text-decoration: underline; }
  .art .s { color: #6b7686; margin-top: 2px; font-size: 11px; }

  .note { font-size: 10.5px; color: #7a8599; line-height: 1.75; margin-top: 8px; }
  .note b { color: #4a5568; }

  .foot { margin-top: 22px; border-top: 1px solid #e6eaf1; padding-top: 9px;
    font-size: 10px; color: #a8b0be; display: flex; justify-content: space-between; }

  @media print {
    body { background: #fff; }
    .bar { display: none; }
    .sheet { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
    h2 { break-after: avoid; }
    table, .kpis, .lead { break-inside: avoid; }
    tr { break-inside: avoid; }
  }
  @media (max-width: 820px) {
    .sheet { width: auto; margin: 10px; padding: 16px 14px; }
    .kpis { flex-wrap: wrap; }
    .kpi { min-width: 44%; }
  }
</style>
</head>
<body>

<div class="bar">
  <a class="home" href="index.html">← 대시보드</a>
  <select id="range">
    <option value="7">최근 7일</option>
    <option value="14">최근 14일</option>
    <option value="30">최근 30일</option>
  </select>
  <span class="sp"></span>
  <button id="mailBtn">✉ 메일 초안 열기</button>
  <button class="go" onclick="window.print()">🖨 인쇄 · PDF 저장</button>
</div>

<div class="sheet" id="sheet">불러오는 중…</div>

<script>
const CAT_LABEL = { 교통: "교통", 환경: "환경", 행정: "행정", 문화관광: "문화·관광",
  산업경제: "산업·경제", 안전: "안전", 복지: "복지" };
const CATS = Object.keys(CAT_LABEL);
let NEWS = [], LIVE = null, BENCH = null, DAYS = 7;

const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
const kdate = s => s ? s.slice(5).replace("-", "/") : "";

async function grab(url) {
  try {
    const r = await fetch(url, { cache: "no-store" });
    return r.ok ? await r.json() : null;
  } catch (e) { return null; }
}

// 기준일은 오늘이 아니라 '수집된 마지막 기사 날짜'다.
// 수집이 하루 밀려도 보고서 기간이 통째로 어긋나지 않게 하기 위해서다.
function window_(days) {
  const last = NEWS.reduce((m, n) => n.date > m ? n.date : m, NEWS[0].date);
  const d = new Date(last + "T00:00:00");
  d.setDate(d.getDate() - (days - 1));
  const from = d.toISOString().slice(0, 10);
  return { from, to: last, rows: NEWS.filter(n => n.date >= from && n.date <= last) };
}

function render() {
  const cur = window_(DAYS);
  const prev = (() => {
    const d = new Date(cur.from + "T00:00:00");
    const to = new Date(d); to.setDate(to.getDate() - 1);
    d.setDate(d.getDate() - DAYS);
    const f = d.toISOString().slice(0, 10), t = to.toISOString().slice(0, 10);
    return { from: f, to: t, rows: NEWS.filter(n => n.date >= f && n.date <= t) };
  })();

  const neg = cur.rows.filter(n => n.senti === "부정");
  const ratio = pct(neg.length, cur.rows.length);
  const pratio = pct(prev.rows.filter(n => n.senti === "부정").length, prev.rows.length);

  // 평상시 기준 = 사람이 걸러낸 검증본 전체. 지금이 높은지 낮은지 견줄 유일한 기준이다.
  const ver = NEWS.filter(n => n.src !== "자동수집");
  const base = pct(ver.filter(n => n.senti === "부정").length, ver.length);

  const diff = Math.round((ratio - base) * 10) / 10;
  const word = diff < -0.5 ? "낮습니다" : diff > 0.5 ? "높습니다" : "비슷합니다";
  const cls = diff < -0.5 ? "down" : diff > 0.5 ? "up" : "flat";

  // 분야별
  const rows = CATS.map(c => {
    const a = cur.rows.filter(n => n.cat === c);
    const b = prev.rows.filter(n => n.cat === c);
    return { c, n: a.length, neg: a.filter(x => x.senti === "부정").length,
             pneg: b.filter(x => x.senti === "부정").length };
  }).filter(r => r.n > 0).sort((a, b) => b.neg - a.neg || b.n - a.n);

  const topCat = rows.slice().sort((a, b) => b.n - a.n)[0];
  const kw = {};
  cur.rows.forEach(n => (n.kw || []).forEach(k => kw[k] = (kw[k] || 0) + 1));
  const topKw = Object.entries(kw).sort((a, b) => b[1] - a[1]).slice(0, 8);

  // 주목 이슈 — 대시보드가 쓰는 묶음을 그대로 쓴다. 두 화면이 다른 말을 하면 안 된다.
  const issues = ((LIVE && LIVE.today && LIVE.today.items) || [])
    .filter(it => it.last >= cur.from).slice(0, 5);

  const bench = BENCH && Array.isArray(BENCH.cities) ? BENCH.cities : null;
  const us = bench && bench.find(c => c.name === "화성시");

  const negSorted = neg.slice().sort((a, b) => b.date.localeCompare(a.date));

  document.getElementById("sheet").innerHTML = `
  <div class="head">
    <h1>화성시 언론보도 주간 보고</h1>
    <div class="meta">
      <span>보고 기간 <b>${cur.from} ~ ${cur.to}</b></span>
      <span>대상 기사 <b>${cur.rows.length.toLocaleString()}건</b></span>
      <span>작성 <b>${new Date().toISOString().slice(0, 10)}</b></span>
      <span class="muted">핀포인트 언론보도 대시보드 자동 생성</span>
    </div>
  </div>

  <h2>1. 요약</h2>
  <div class="lead">
    이번 기간 화성시 관련 보도는 <b>${cur.rows.length.toLocaleString()}건</b>이고,
    이 가운데 부정 보도는 <span class="neg">${neg.length}건(${ratio}%)</span>입니다.
    사람이 걸러낸 검증본 <b>${ver.length.toLocaleString()}건</b>의 평상시 부정 비율 <b>${base}%</b>와 견주면
    <span class="${cls}">${Math.abs(diff)}%p ${word}</span>.
    ${prev.rows.length ? `직전 같은 기간(${prev.from}~${prev.to})은 ${pratio}%였습니다.` : ""}
    ${topCat ? `보도가 가장 많은 분야는 <b>${CAT_LABEL[topCat.c]}</b>(${topCat.n}건)이고,` : ""}
    ${rows[0] && rows[0].neg ? `부정 보도는 <b>${CAT_LABEL[rows[0].c]}</b>에 ${rows[0].neg}건으로 가장 많이 몰려 있습니다.` : "부정 보도가 특정 분야에 몰리지 않았습니다."}
  </div>

  <h2>2. 주요 지표</h2>
  <div class="kpis">
    <div class="kpi"><div class="k">전체 보도</div><div class="v">${cur.rows.length.toLocaleString()}</div>
      <div class="s">직전 기간 ${prev.rows.length.toLocaleString()}건</div></div>
    <div class="kpi"><div class="k">부정 보도</div><div class="v warn">${neg.length}</div>
      <div class="s">직전 기간 ${prev.rows.filter(n => n.senti === "부정").length}건</div></div>
    <div class="kpi"><div class="k">부정 비율</div><div class="v ${diff > 0.5 ? "warn" : ""}">${ratio}%</div>
      <div class="s">평상시 ${base}% 대비 <span class="${cls}">${diff > 0 ? "+" : ""}${diff}%p</span></div></div>
    <div class="kpi"><div class="k">주목 이슈</div><div class="v">${issues.length}</div>
      <div class="s">사건 단위로 묶은 건수</div></div>
  </div>

  ${issues.length ? `
  <h2>3. 먼저 확인할 이슈</h2>
  <table>
    <thead><tr><th class="c" style="width:34px">순위</th><th>사안</th>
      <th class="c" style="width:64px">분야</th><th class="c" style="width:52px">매체</th>
      <th class="c" style="width:74px">최근 보도</th><th class="n" style="width:52px">점수</th></tr></thead>
    <tbody>${issues.map((it, i) => `
      <tr><td class="c">${i > 0 && issues[i - 1].score === it.score ? i : i + 1}</td>
        <td class="art"><span class="t">${esc(it.label)}</span>
          ${it.count > 1 ? `<div class="s">같은 사안 ${it.count}건</div>` : ""}</td>
        <td class="c">${CAT_LABEL[it.cat] || it.cat || "-"}</td>
        <td class="c">${it.sources || 1}곳</td>
        <td class="c">${it.last}</td>
        <td class="n">${it.score}점</td></tr>`).join("")}
    </tbody>
  </table>
  <div class="note">점수는 <b>최신성(45)·매체 수(30)·기사 수(15)·지속성(10)</b>을 더한 100점 만점 값입니다.
    계산은 코드가 하고 AI는 개입하지 않습니다. 점수가 같으면 같은 순위로 표시하며, 위아래 순서는 우열이 아닙니다.</div>
  ` : ""}

  <h2>${issues.length ? "4" : "3"}. 분야별 현황</h2>
  <table>
    <thead><tr><th>분야</th><th class="n">보도</th><th class="n">부정</th>
      <th class="n">부정 비율</th><th class="n">직전 대비</th></tr></thead>
    <tbody>${rows.map(r => {
      const d = r.neg - r.pneg;
      return `<tr><td>${CAT_LABEL[r.c]}</td><td class="n">${r.n}</td><td class="n">${r.neg}</td>
        <td class="n">${pct(r.neg, r.n)}%</td>
        <td class="n ${d > 0 ? "up" : d < 0 ? "down" : "flat"}">${d > 0 ? "▲ " + d : d < 0 ? "▼ " + Math.abs(d) : "-"}</td></tr>`;
    }).join("")}</tbody>
  </table>

  ${bench ? `
  <h2>${issues.length ? "5" : "4"}. 인접 시 대조</h2>
  <table>
    <thead><tr><th>도시</th><th class="n">표본</th><th class="n">부정</th><th class="n">부정 비율</th></tr></thead>
    <tbody>${bench.map(c => `<tr class="${c.name === "화성시" ? "us" : ""}">
      <td>${c.name}</td><td class="n">${c.count}</td><td class="n">${c.neg}</td>
      <td class="n">${c.ratio}%</td></tr>`).join("")}</tbody>
  </table>
  <div class="note">${BENCH.from} ~ ${BENCH.to} 기사를 도시마다 <b>같은 검색 방식으로 모아 같은 AI 판정</b>을 적용했습니다.
    도시당 표본이 ${Math.min(...bench.map(c => c.count))}~${Math.max(...bench.map(c => c.count))}건이라
    <b>정밀한 순위가 아니라 대략의 위치</b>를 보는 값입니다.
    기사 수는 수집 시점에 좌우되므로 견주지 않고 비율만 견줍니다.</div>
  ` : ""}

  <h2>${(issues.length ? 5 : 4) + (bench ? 1 : 0)}. 부정 보도 목록 <span class="muted" style="font-size:11px;font-weight:400">${neg.length}건</span></h2>
  ${neg.length ? `<table>
    <thead><tr><th class="c" style="width:52px">날짜</th><th class="c" style="width:64px">분야</th><th>제목</th></tr></thead>
    <tbody>${negSorted.map(n => `<tr>
      <td class="c">${kdate(n.date)}</td>
      <td class="c">${CAT_LABEL[n.cat] || n.cat}</td>
      <td class="art"><span class="t">${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>` : esc(n.title)}</span>
        ${n.summary ? `<div class="s">${esc(n.summary)}</div>` : ""}</td></tr>`).join("")}
    </tbody></table>`
   : `<div class="lead">이 기간에 부정으로 분류된 보도가 없습니다.</div>`}

  <h2>${(issues.length ? 6 : 5) + (bench ? 1 : 0)}. 주요 키워드</h2>
  <table>
    <thead><tr><th>키워드</th><th class="n">언급</th><th>키워드</th><th class="n">언급</th></tr></thead>
    <tbody>${Array.from({ length: Math.ceil(topKw.length / 2) }, (_, i) => {
      const a = topKw[i * 2], b = topKw[i * 2 + 1];
      return `<tr><td>${esc(a[0])}</td><td class="n">${a[1]}</td>
        <td>${b ? esc(b[0]) : ""}</td><td class="n">${b ? b[1] : ""}</td></tr>`;
    }).join("")}</tbody>
  </table>

  <div class="note" style="margin-top:18px">
    <b>데이터와 한계.</b> 기사 제목·날짜·요약만 수집하며 본문은 읽지 않습니다.
    분야와 긍부정은 AI가 제목을 보고 판정한 값으로, <b>사람이 검수한 정확도 수치는 아직 없습니다.</b>
    따라서 부정으로 표시된 보도는 담당자가 원문을 확인하는 것을 전제로 합니다.
    출처는 빅카인즈 검증본(사람이 선별)과 구글 뉴스 RSS 자동수집(기계가 선별) 두 가지이며,
    수집 범위가 달라 두 구간의 건수는 서로 견줄 수 없습니다. 비율만 견줍니다.
    ${LIVE && LIVE.ops ? `자동 수집은 ${LIVE.ops.since}부터 ${LIVE.ops.runs}회 실행해 실패 ${LIVE.ops.failures}회입니다.` : ""}
  </div>

  <div class="foot">
    <span>핀포인트 · 화성시 AI·DATA 공모전 지정과제 16번</span>
    <span>${LIVE ? "데이터 갱신 " + LIVE.updated : ""}</span>
  </div>`;

  // 메일 초안 — 서버 없이 담당자의 메일 프로그램을 열어 본문까지 채워 준다.
  document.getElementById("mailBtn").onclick = () => {
    const lines = [
      `화성시 언론보도 주간 보고 (${cur.from} ~ ${cur.to})`, "",
      `전체 보도 ${cur.rows.length.toLocaleString()}건 / 부정 ${neg.length}건 (${ratio}%)`,
      `평상시 기준 ${base}% 대비 ${Math.abs(diff)}%p ${word.replace("습니다", "음")}`,
      us && bench ? `인접 시 대조: ${bench.map(c => c.name + " " + c.ratio + "%").join(" / ")}` : "",
      "", "[먼저 확인할 이슈]",
      ...(issues.length ? issues.map((it, i) => `${i + 1}. ${it.label} (${CAT_LABEL[it.cat] || it.cat}, ${it.sources || 1}개 매체, ${it.score}점)`)
                        : ["없음"]),
      "", `자세한 내용은 대시보드에서 확인하실 수 있습니다.`,
      location.href.replace(/\/report\.html.*$/, "/"), "",
      "※ 분야·긍부정은 AI가 제목을 보고 판정한 값입니다. 부정 보도는 원문 확인을 권합니다.",
    ].filter(x => x !== "");
    location.href = "mailto:?subject=" + encodeURIComponent(lines[0])
      + "&body=" + encodeURIComponent(lines.slice(1).join("\n"));
  };
}

(async () => {
  const base = await grab("news_data.json");
  if (!Array.isArray(base) || !base.length) {
    document.getElementById("sheet").textContent = "데이터를 불러오지 못했습니다.";
    return;
  }
  base.forEach(n => n.src = "검증본");
  NEWS = base;
  LIVE = await grab("news_live.json");
  if (LIVE && Array.isArray(LIVE.items)) {
    LIVE.items.forEach(n => n.src = "자동수집");
    NEWS = NEWS.concat(LIVE.items);
  }
  BENCH = await grab("benchmark.json");

  const q = new URLSearchParams(location.search).get("days");
  if (q && ["7", "14", "30"].includes(q)) DAYS = Number(q);
  const sel = document.getElementById("range");
  sel.value = String(DAYS);
  sel.onchange = () => { DAYS = Number(sel.value); render(); };
  render();
})();
</script>
</body>
</html>
